name: Test Action
on:
  workflow_dispatch:

jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar Action
        uses: ./
        with:
          nombre: GitHub Actions
      - name: Jeico Action
        uses: Jeicob12/action@main
        with: 
            nombre: Jeicob          
      - name: Lautaro Action
        uses: LautaroReartes/github-action-lautaro-reartes@main
        with: 
            nombre: Lautaro
      - name: Matias Action
        uses: mguazzaroni/github-action-matias-guazzaroni@main
        with: 
            nombre: Matias
      - name: Fabian Action
        uses: fabiancapellino-tradify/mi-primera-github-action@main
        with: 
            nombre: Fabian