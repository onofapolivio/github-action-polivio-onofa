name: CI - Node Express

on:
  push:
    branches: 
     - main

jobs:
    test:
      runs-on: ubuntu:latest
      
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.15.1

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar pruebas
        run: npm test    