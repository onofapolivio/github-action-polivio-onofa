name: CI - Node Express

on:
  push:
    branches: 
     - main

jobs:
    test:
      runs-on: ubuntu:latest      

      steps:
        - name: Obtener código
          uses: actions/checkout@v4
  
        - name: Configurar Node
          uses: actions/setup-node@v4
          with:
            node-version: 22.23.4
  
        - name: Instalar dependencias
          run: npm install
  
        - name: Ejecutar pruebas
          run: npm test    
